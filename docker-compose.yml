services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20.19.6-alpine3.21}
        PNPM_VERSION: ${PNPM_VERSION:-10.30.2}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: qq-farm-bot:latest
    container_name: qq-farm-bot
    restart: unless-stopped
    ports:
      - "${PORT:-3690}:3690"
    volumes:
      - qq-farm-data:/app/core/data
      - qq-farm-logs:/app/core/data/logs
      - /run/qqfarm-napcat-bridge:/run/qqfarm-napcat-bridge
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      - ADMIN_PORT=3690
      - ALLOW_ORIGIN=https://farm.linxiaoran.com
      - NAPCAT_BRIDGE_SOCKET=/run/qqfarm-napcat-bridge/bridge.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3690/api/game-version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qq-farm-data:
    name: qq-farm-data
  qq-farm-logs:
    name: qq-farm-logs
