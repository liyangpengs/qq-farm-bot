syntax = "proto3";

package gamepb.plantpb;

import "corepb.proto";

// ============ 生长阶段枚举 ============
enum PlantPhase {
    PHASE_UNKNOWN = 0;
    SEED = 1;           // 种子
    GERMINATION = 2;    // 发芽
    SMALL_LEAVES = 3;   // 小叶
    LARGE_LEAVES = 4;   // 大叶
    BLOOMING = 5;       // 开花
    MATURE = 6;         // 成熟 (可收获)
    DEAD = 7;           // 枯死
}

// ============ 土地信息 ============
message LandInfo {
    int64 id = 1;
    bool unlocked = 2;
    int64 level = 3;
    int64 max_level = 4;
    bool could_unlock = 5;
    bool could_upgrade = 6;
    LandUnlockCondition unlock_condition = 7;
    LandUpgradeCondition upgrade_condition = 8;
    Buff buff = 9;
    PlantInfo plant = 10;
    bool is_shared = 11;
    bool can_share = 12;
    int64 master_land_id = 13;
    repeated int64 slave_land_ids = 14;
    int64 land_size = 15;
    int64 lands_level = 16;
    int64 field_17 = 17;                       // unknown new field

    // 土地buff
    message Buff {
        int64 plant_yield_bonus = 1;
        int64 planting_time_reduction = 2;
        int64 plant_exp_bonus = 3;
    }
}

// 土地解锁条件
message LandUnlockCondition {
    int64 preceding_land_id = 1;
    int64 need_level = 2;
    int64 need_gold = 3;
}

// 土地升级条件 (简化)
message LandUpgradeCondition {
    int64 condition_type = 1;
    int64 condition_value = 2; // condition_type=1 时已确认代表所需角色等级
    repeated corepb.Item required_items = 3;
}

// ============ 偷菜玩家信息 ============
message StealPlayer {
    int64 gid = 1;                  // 偷菜者GID
    int64 num = 2;                  // 已偷次数
}

// ============ 植物信息 ============
message PlantInfo {
    int64 id = 1;                              // 植物/种子ID
    string name = 2;                           // 名称
    // field 3 reserved
    repeated PlantPhaseInfo phases = 4;        // 生长阶段列表
    int64 season = 5;                          // 季节
    int64 dry_num = 6;                         // 缺水次数 (>0需要浇水)
    // fields 7,8 reserved
    int64 stole_num = 9;                       // 被偷次数
    int64 fruit_id = 10;                       // 果实ID
    int64 fruit_num = 11;                      // 果实数量
    repeated int64 weed_owners = 12;           // 放草的人 (非空=有草)
    repeated int64 insect_owners = 13;         // 放虫的人 (非空=有虫)
    bytes stealers = 14;                       // 偷菜的人 (服务端格式不一致，需手动解析)
    int64 grow_sec = 15;                       // 生长秒数
    bool stealable = 16;                       // 是否可偷
    int64 left_inorc_fert_times = 17;          // 剩余施肥次数
    int64 left_fruit_num = 18;                 // 剩余果实数
    int64 steal_intimacy_level = 19;           // 偷菜亲密度等级
    repeated int64 mutant_config_ids = 20;     // 变异配置ID
    bool is_nudged = 21;                       // 是否被催熟
    // repeated StealPlayer steal_player = 22;    // 旧版: 偷菜玩家详情 (GID+已偷次数)
    int64 steal_player = 22;                   // 偷菜玩家相关数值 (服务端已改为varint)
    bytes steal_num = 23;                      // 每人最大可偷次数 (服务端为bytes)
    int64 field_24 = 24;                       // unknown new field
    int64 field_25 = 25;                       // unknown new field
    int64 field_26 = 26;                       // unknown new field
    int64 field_27 = 27;                       // unknown new field
    bytes field_32 = 32;                       // unknown (3-byte varint, 推测为某种ID)
    PlantLimitInfo field_34 = 34;              // 植物限制信息
    // ItemService.Use 回包中已抓包确认：道具使用记录（301101=黄金虫，301102=足球）。
    repeated PlantInteractionUseInfo interaction_uses = 35;
    PlantActivityInfo field_36 = 36;           // 植物活动信息
    int64 field_37 = 37;                       // unknown new field
    // ItemService.Use 回包中已抓包确认：道具目标记录，field 4 为目标土地 ID。
    repeated PlantInteractionTargetInfo interaction_targets = 38;
    // 重复的历史/扩展记录；同一土地可同时出现多条，且黄金虫/足球清理后仍会保留。
    // 当前互动道具以 interaction_uses / interaction_targets 为准；仅七夕灵露可结合变异 13 作保守兜底。
    repeated PlantExtendedStatus field_40 = 40;
    // 变异扩展记录；配置 ID 可与 mutant_config_ids / phase.mutants 交叉确认。
    repeated PlantMutationRecord extended_mutations = 41;
}

// PlantInfo.field 35：ItemService.Use 成功回包中的道具使用信息。
message PlantInteractionUseInfo {
    int64 item_id = 1;
    int64 count = 2;
    int64 effect_type = 3;
    int64 host_gid = 4;
    int64 timestamp = 5;
}

// PlantInfo.field 38：ItemService.Use 成功回包中的目标信息。
message PlantInteractionTargetInfo {
    int64 item_id = 1;
    int64 host_gid = 2;
    int64 timestamp = 3;
    int64 land_id = 4;
}

// PlantInfo.field 40：土地历史/扩展记录，字段语义尚未完全确认。
message PlantExtendedStatus {
    int64 value_1 = 1;
    int64 value_2 = 2;
}

// PlantInfo.field 41：抓包观察到的变异扩展记录。
message PlantMutationRecord {
    int64 timestamp = 1;
    int64 mutant_config_id = 2;
    int64 field_3 = 3;
    int64 field_4 = 4;
    int64 field_5 = 5;
    int64 field_6 = 6;
}

// 植物限制信息 (field 34)
message PlantLimitInfo {
    int64 config_id = 1;                       // 配置ID (如1001)
    int64 limit = 2;                           // 限制值 (如300)
    int64 value = 3;                           // 当前值 (如1020184)
}

// 植物活动信息 (field 36)
message PlantActivityInfo {
    int64 activity_id = 1;                     // 活动ID (如1019)
    int64 param1 = 2;                          // 参数1 (如240)
    int64 param2 = 3;                          // 参数2 (如191)
    int64 date = 4;                            // 日期 (如2026060100)
}

// ============ 生长阶段详情 ============
message PlantPhaseInfo {
    int32 phase = 1;               // PlantPhase 枚举值
    int64 begin_time = 2;          // 阶段开始时间
    int64 phase_id = 3;            // 阶段ID
    // fields 4,5 reserved
    int64 dry_time = 6;            // 变干时间 (>0 需要浇水)
    int64 weeds_time = 7;          // 长草时间 (>0 有杂草)
    int64 insect_time = 8;         // 生虫时间 (>0 有虫害)
    map<int64, int64> ferts_used = 9;  // 已用肥料
    repeated MutantInfo mutants = 10;  // 变异信息
}

// 变异信息
message MutantInfo {
    int64 mutant_time = 1;
    int64 mutant_config_id = 2;
    int64 weather_id = 3;
}

// ============ 操作限制 ============
// 每种操作的每日限制信息
message OperationLimit {
    int64 id = 1;                   // 操作类型ID
    int64 day_times = 2;            // 今日已操作次数
    int64 day_times_lt = 3;         // 每日操作上限
    int64 day_share_id = 4;         // 分享ID
    int64 day_exp_times = 5;        // 今日已获得经验次数
    int64 day_ex_times_lt = 6;      // 每日可获得经验上限
    int64 day_exp_share_id = 7;     // 经验分享ID
}
// 抓包已确认的捣乱操作 ID:
//   10003 = 放草/放虫共用的每日资格额度
//   10004 = 放虫计数（PutInsects 会同时返回 10003）
// Farming/帮助操作回包使用 10005、10006、10007。
//   10015 = 放置社交道具

// ============ 请求/回复消息 ============

// --- 获取所有土地 ---
message AllLandsRequest {
    int64 host_gid = 1;      // 0或自己的GID=查看自己
}

// 农场级社交事件。实机已确认 5005=青蛙使坏瓶；它不绑定某一块土地。
message FarmSocialEvent {
    int64 item_id = 1;
    int64 visitor_gid = 2;
    int64 timestamp = 3;
}

message AllLandsReply {
    repeated LandInfo lands = 1;
    repeated OperationLimit operation_limits = 2;
    repeated FarmSocialEvent social_events = 3;
}

// --- 收获 ---
message HarvestRequest {
    repeated int64 land_ids = 1;    // 要收获的土地ID列表
    int64 host_gid = 2;            // 农场主GID
    bool is_all = 3;               // 是否全部收获
}

message HarvestReply {
    repeated LandInfo land = 1;
    // repeated Item items = 2;     // corepb.Item
    // repeated Item lost_items = 3;
    repeated OperationLimit operation_limits = 4;
}

// --- 浇水 ---
message WaterLandRequest {
    repeated int64 land_ids = 1;
    int64 host_gid = 2;
}

message WaterLandReply {
    repeated LandInfo land = 1;
    repeated OperationLimit operation_limits = 2;
}

// --- 务农 (除草+除虫合并) ---
message FarmingRequest {
    repeated int64 land_ids = 1;
    int64 host_gid = 2;
    int32 field_3 = 3; // 场景字段，自家与普通好友抓包均显式编码为 0
    int32 field_4 = 4; // 场景字段，自家抓包显式编码为 0，普通好友抓包值为 2
    // 自家农场待清理的农场级社交道具 ID。青蛙存在时官方单点与一键务农均发送 5005。
    repeated int64 social_event_item_ids = 5 [packed = true];
}

message FarmingResult {
    int64 land_id = 1;
    corepb.Item reward = 2;
}

message FarmingSocialEventReward {
    int64 item_id = 1;
    corepb.Item reward = 2;
}

message FarmingReply {
    repeated LandInfo land = 1;
    repeated OperationLimit operation_limits = 2;
    repeated FarmingResult results = 3;
    repeated FarmingSocialEventReward social_event_rewards = 4;
}

// --- 除草 (旧版兼容) ---
message WeedOutRequest {
    repeated int64 land_ids = 1;
    int64 host_gid = 2;
}

message WeedOutReply {
    repeated LandInfo land = 1;
    repeated OperationLimit operation_limits = 2;
}

// --- 除虫 (旧版兼容) ---
message InsecticideRequest {
    repeated int64 land_ids = 1;
    int64 host_gid = 2;
}

message InsecticideReply {
    repeated LandInfo land = 1;
    repeated OperationLimit operation_limits = 2;
}

// --- 播种 ---
message PlantItem {
    int64 seed_id = 1;              // 种子ID
    repeated int64 land_ids = 2;    // 要种植的土地ID列表
    bool auto_slave = 3;            // 是否自动副产
}

message PlantRequest {
    map<int64, int64> land_and_seed = 1;   // land_id -> seed_id (旧版)
    repeated PlantItem items = 2;          // 新版: 按种子分组种植
}

message PlantReply {
    repeated LandInfo land = 1;
    repeated OperationLimit operation_limits = 2;
}

// --- 移除植物 ---
message RemovePlantRequest {
    repeated int64 land_ids = 1;
}

message RemovePlantReply {
    repeated LandInfo land = 1;
    repeated OperationLimit operation_limits = 2;
}

// --- 施肥 ---
message FertilizeRequest {
    repeated int64 land_ids = 1;
    int64 fertilizer_id = 2;
}

// 单次施肥实际消耗。field 1 的语义尚未完全确认；field 3 已通过
// FertilizeReply 与紧随其后的 ItemNotify 交叉验证为本次消耗的肥料秒数。
message FertilizerUse {
    int64 field_1 = 1;
    corepb.Item consumed = 3;
}

message FertilizeReply {
    repeated LandInfo land = 1;
    repeated OperationLimit operation_limits = 2;
    corepb.Item fertilizer = 3;       // 肥料 ID 与剩余肥料时间
    FertilizerUse fertilizer_use = 4; // 本次实际消耗
}

// --- 放虫 ---
message PutInsectsRequest {
    int64 host_gid = 1;
    repeated int64 land_ids = 2;
}

message PutInsectsReply {
    repeated LandInfo land = 1;
    repeated OperationLimit operation_limits = 2;
}

// --- 放草 ---
message PutWeedsRequest {
    int64 host_gid = 1;
    repeated int64 land_ids = 2;
}

message PutWeedsReply {
    repeated LandInfo land = 1;
    repeated OperationLimit operation_limits = 2;
}

// --- 升级土地 ---
message UpgradeLandRequest {
    int64 land_id = 1;
}

message UpgradeLandReply {
    LandInfo land = 1;
}

// --- 解锁土地 ---
message UnlockLandRequest {
    int64 land_id = 1;
    bool do_shared = 2;
}

message UnlockLandReply {
    LandInfo land = 1;
}

// --- 放置社交道具 (如友谊果实) ---
message PutSocialItemRequest {
    int64 host_gid = 1;       // 好友农场GID
    int64 land_id = 2;        // 目标土地ID (单个)
    int64 item_id = 3;        // 社交道具ID (如 301101=友谊果实)
}

message ItemChange {
    int64 land_id = 1;
    int64 item_id = 2;
    int64 count = 3;
}

message PutSocialItemReply {
    LandInfo land = 1;                        // 操作后的土地信息
    OperationLimit operation_limit = 2;       // 操作限制 (id=10015)
    repeated ItemChange rewards = 3;          // 奖励 (经验等)
    repeated ItemChange consumed = 4;         // 消耗的道具
}

// ============ 服务器推送通知 ============

// 土地状态变化通知 (被放虫/放草/偷菜等)
message LandsNotify {
    repeated LandInfo lands = 1;   // 变化的土地列表
    int64 host_gid = 2;            // 农场主GID
}

// 青蛙等农场级社交事件变化；清空事件时 social_events 为空。
message FarmSocialEventsNotify {
    repeated FarmSocialEvent social_events = 1;
    int64 host_gid = 2;
}
