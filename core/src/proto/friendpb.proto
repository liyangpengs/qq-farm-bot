syntax = "proto3";

package gamepb.friendpb;

import "avatarframepb.proto";
import "weatherpb.proto";

// ============ 好友农场摘要信息 ============
message Plant {
    int64 dry_time_sec = 1;      // 缺水倒计时秒
    int64 weed_time_sec = 2;     // 长草倒计时秒
    int64 insect_time_sec = 3;   // 生虫倒计时秒
    int64 ripe_time_sec = 4;     // 成熟倒计时秒
    int64 ripe_fruit_id = 5;     // 成熟果实ID
    int64 steal_plant_num = 6;   // 可偷数量
    int64 dry_num = 7;           // 缺水地块数
    int64 weed_num = 8;          // 有草地块数
    int64 insect_num = 9;        // 有虫地块数
}

// ============ 标签 ============
message Tags {
    bool is_new = 1;
    bool is_follow = 2;
}

// ============ 好友信息 ============
message GameFriend {
    int64 gid = 1;
    string open_id = 2;
    string name = 3;
    string avatar_url = 4;
    string remark = 5;
    int64 level = 6;
    int64 gold = 7;
    Tags tags = 8;
    Plant plant = 9;
    int32 authorized_status = 10;
    FriendIllustrated illustrated = 12;
    repeated gamepb.avatarframepb.AvatarFrame equip_avatar_frames = 13;
    int64 exp = 14;
    bool field_15 = 15;
    FriendTitle title = 16;
    FriendActivity activity = 18;
    int64 last_active_time = 19;
    gamepb.weatherpb.WeatherStatus weather = 20;
    // field 11 reserved
    // Illustrated illustrated = 12;  // 略
    // repeated AvatarFrame equip_avatar_frames = 13;  // 略
}

message FriendIllustrated {
    int64 current = 1;
    int64 target = 2;
}

message FriendTitle {
    int64 title_id = 1;
}

message FriendActivity {
    int64 activity_id = 1;
    int64 progress = 2;
    int64 updated_at = 3;
}

message RecommendedFriend {
    int64 gid = 1;
    string name = 2;
    string avatar_url = 3;
    int64 level = 4;
    int64 updated_at = 5;
    string open_id = 6;
}

// ============ 请求/回复 ============

// --- 获取所有好友 ---
message GetAllRequest {}

message GetAllReply {
    repeated GameFriend game_friends = 1;
    // repeated Invitation invitations = 2;  // 略
    int64 application_count = 3;
}

// --- 获取指定游戏好友 (通过GID列表) ---
message GetGameFriendsRequest {
    repeated int64 gids = 1;
}

message GetGameFriendsReply {
    repeated GameFriend game_friends = 1;
    int64 application_count = 3;
}

// --- 同步好友 (带 open_ids) ---
message SyncAllRequest {
    // field 1 reserved
    repeated string open_ids = 2;
}

message SyncAllReply {
    repeated GameFriend game_friends = 1;
    // repeated Invitation invitations = 2;  // 略
    int64 application_count = 3;
    repeated RecommendedFriend recommended_friends = 5;
}

// ============ 好友申请 (微信同玩) ============

// 申请信息
message Application {
    int64 gid = 1;
    int64 time_at = 2;
    string open_id = 3;
    string name = 4;
    string avatar_url = 5;
    int64 level = 6;
    // repeated AvatarFrame equip_avatar_frames = 7;  // 略
}

// --- 获取好友申请列表 ---
message GetApplicationsRequest {}

message GetApplicationsReply {
    repeated Application applications = 1;
    bool block_applications = 2;  // 是否屏蔽申请
}

// --- 同意好友申请 ---
message AcceptFriendsRequest {
    repeated int64 friend_gids = 1;
}

message AcceptFriendsReply {
    repeated GameFriend friends = 1;
}

// --- 拒绝好友申请 ---
message RejectFriendsRequest {
    repeated int64 friend_gids = 1;
}

message RejectFriendsReply {}

// --- 删除好友 ---
// 抓包样例: gamepb.friendpb.FriendService.DelFriend
message DelFriendRequest {
    int64 friend_gid = 1;
}

message DelFriendReply {}

// --- 设置屏蔽申请 ---
message SetBlockApplicationsRequest {
    bool block = 1;
}

message SetBlockApplicationsReply {
    bool block = 1;
}

// --- 获取分享Key ---
message GetShareKeyRequest {
    int64 share_cfg_id = 1;
}

message GetShareKeyReply {
    string share_key = 1;
    string share_url = 2;
    int64 share_cfg_id = 3;
}

// ============ 服务器推送通知 ============

// 收到好友申请通知
message FriendApplicationReceivedNotify {
    repeated Application applications = 1;
}

// 好友添加成功通知 (对方同意后)
message FriendAddedNotify {
    repeated GameFriend friends = 1;
}
